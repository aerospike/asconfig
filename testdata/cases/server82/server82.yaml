logging:
    - namespace: info
      masking: info
      name: console
mod-lua:
    allow-unsafe-lua: false
namespaces:
    - default-read-touch-ttl-pct: 0
      index-type:
        type: shmem
      name: ns2
      replication-factor: 2
      apply-ttl-reductions: true
      replication-compression-mode: zstd
      replication-compression-level: -5
      migrate-compression-mode: none
      migrate-compression-level: 22
      index-checkpoint-compression: true
      index-checkpoint-threads: 16
      skip-checkpoint: false
      sets:
        - default-read-touch-ttl-pct: 50
          name: s2
      sindex-type:
        type: shmem
      storage-engine:
        devices:
            - /dummy/mount/point1
        evict-used-pct: 70
        flush-size: 2097152
        stop-writes-avail-pct: 20
        stop-writes-used-pct: 70
        type: device
    - active-rack: 2
      default-read-touch-ttl-pct: 50
      evict-indexes-memory-pct: 50
      index-type:
        type: shmem
      indexes-memory-budget: 2147483648
      name: ns1
      nsup-period: 2048
      replication-factor: 2
      disable-mrt-writes: false
      mrt-duration: 60
      strong-consistency: true
      apply-ttl-reductions: false
      migrate-skip-unreadable: false
      tomb-raider-unmark-threads: 4
      enable-benchmarks-migrate: true
      enable-benchmarks-repl: true
      replication-compression-mode: delta-zstd
      replication-compression-level: 3
      migrate-compression-mode: zstd
      migrate-compression-level: 3
      index-checkpoint-compression: false
      index-checkpoint-threads: 8
      skip-checkpoint: true
      sets:
        - default-read-touch-ttl-pct: -1
          name: s1
      sindex-type:
        type: shmem
      storage-engine:
        data-size: 34359738368
        type: memory
network:
    fabric:
        port: 3001
    heartbeat:
        interval: 150
        mode: multicast
        multicast-groups:
            - 127.0.0.1
        port: 9918
        timeout: 10
    admin:
        addresses:
            - any
        port: 3003
    service:
        addresses:
            - any
        port: 3000
security:
    default-password-file: /dummy/file/path2
service:
    batch-max-requests: 1000
    cgroup-mem-tracking: true
    cluster-name: cl1
    group: root
    pidfile: /dummy/file/path1
    tls-refresh-period: 300
    user: root
    enable-benchmarks-wire-compression: true
    error-details-max-verbosity: messages
    index-checkpoint-path: /opt/aerospike/data
    smd-compression-mode: zstd
    smd-compression-level: 3
xdr:
    dcs:
        - name: dataCenter1
          recovery-threads: 4
          namespaces:
            - name: ns1
              remote-namespace: ns2
              ship-versions-interval: 120
              ship-versions-policy: interval
          node-address-ports:
            - 127.0.0.1:3000
