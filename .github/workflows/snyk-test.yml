name: "Snyk Report"

on:
  workflow_call:
  workflow_dispatch:
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Get go version from go.mod
        run: |
          echo "GO_VERSION=$(grep '^go ' go.mod | cut -d " " -f 2)" >> "$GITHUB_ENV"
      - name: Setup go version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Setup snyk CLI
        uses: snyk/actions/setup@cdb760004ba9ea4d525f2e043745dfe85bb9077e
        with: 
          snyk-version: v1.1307.2
      - name: Run Snyk to check for vulnerabilities and record dependencies
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SNYK_TOKEN:-}" ]] \
            || { echo "::error::SNYK_TOKEN is not set, so asconfig-snyk.txt would hold an authentication error instead of a report" >&2; exit 1; }
          rc=0
          snyk test --print-deps > snyk-raw.txt || rc=$?
          sed -r "s/\x1B\[([0-9]{1,3}((;[0-9]{1,3})*)?)?[m|K]//g" snyk-raw.txt | tee asconfig-snyk.txt
          case "${rc}" in
            0|1) ;;
            *) echo "::error::snyk test exited ${rc} without a result, so asconfig-snyk.txt is not a report" >&2; exit 1 ;;
          esac
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Upload snyk results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asconfig-snyk.txt
          path: asconfig-snyk.txt